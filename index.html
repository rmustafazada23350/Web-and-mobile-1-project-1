<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venue Ticketing</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Starlight Theatre</h1>
        <p>Select your seats for the upcoming event</p>
    </header>
    <main class="app-container">
        <section class="map-section">
            <div class="map-controls">
                <button id="btn-zoom-in" title="Zoom In">+</button>
                <button id="btn-zoom-out" title="Zoom Out">-</button>
                <button id="btn-move-up" title="Move Up">↑</button>
                <button id="btn-move-down" title="Move Down">↓</button>
                <button id="btn-move-left" title="Move Left">←</button>
                <button id="btn-move-right" title="Move Right">→</button>
                <button id="btn-reset" title="Reset/Center View">Reset</button>
            </div>
            <div class="map-window" id="map-window">
                <div class="venue-map" id="venue-map">
                    <div id="venue-zones"></div>
                </div>
            </div>
            <div class="legend">
                <span class="legend-item"><span class="seat-sample available"></span> Available</span>
                <span class="legend-item"><span class="seat-sample inspected"></span> Inspected</span>
                <span class="legend-item"><span class="seat-sample in-cart"></span> In Cart</span>
                <span class="legend-item"><span class="seat-sample unavailable"></span> Unavailable</span>
            </div>
        </section>
        <aside class="sidebar">
            <div class="panel inspection-panel">
                <h2>Seat Inspection</h2>
                <div id="inspection-details">
                    <p class="empty-message">Click on an available seat on the map to inspect its details.</p>
                </div>
                <button id="btn-add-cart" class="action-btn" disabled>ADD TO CART</button>
            </div>
            <div class="panel cart-panel">
                <h2>Your Cart</h2>
                <ul id="cart-items" class="cart-items"></ul>
                <div class="cart-summary">
                    <span>Total:</span><span id="cart-total" class="total-price">$0</span>
                </div>
            </div>
        </aside>
    </main>

    <script src="app.js"></script>
</body>
</html>
